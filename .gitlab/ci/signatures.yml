# Preset: the signature check (verify-signatures.sh), included by the project's .gitlab-ci.yml.
# With "pipelines must succeed", nothing reaches dev or main, and no tag stays, unverified. dev and
# main take no pushes and only fast-forward to a request's head, whose pipeline verified that very
# commit, so they run no pipeline of their own.
verify-signatures:
  stage: test
  image: docker.io/library/alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git openssh-keygen
  script:
    - sh .gitlab/ci/verify-signatures.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(dev|main)$/
    - if: $CI_COMMIT_TAG =~ /^v/
